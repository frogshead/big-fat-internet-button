[package]
name = "firmware"
version = "0.1.0"
authors = ["Mikko Viitamäki <mikko.vitamaki@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
esp-hal = { version = "1.0.0", features = ["esp32c6", "unstable"] }
esp-backtrace = { version = "0.14.2", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.12.0", features = ["esp32c6", "log"] }
log = { version = "0.4.22" }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c6"] }
esp-hal-smartled = { version = "0.17.0" }
smart-leds = { version = "0.4.0" }

# WiFi and networking (using Embassy async)
esp-alloc = { version = "0.9.0" }
esp-radio = { version = "0.17.0", features = ["esp32c6", "wifi", "esp-alloc", "unstable"] }
esp-rtos = { version = "0.2.0", features = ["esp32c6", "esp-radio", "esp-alloc", "embassy"] }
embassy-time = "0.5"
embassy-net = { version = "0.7", features = ["tcp", "dhcpv4", "medium-ethernet", "dns"] }
embassy-executor = { version = "0.9", default-features = false }
heapless = { version = "0.8", default-features = false }
static_cell = "2.1"

# HTTPS/TLS support
reqwless = { version = "0.12", default-features = false, features = ["esp-mbedtls", "log"] }
esp-mbedtls = { git = "https://github.com/esp-rs/esp-mbedtls.git", features = ["esp32c6"] }
