[package]
name = "firmware"
version = "0.1.0"
authors = ["Mikko Viitamäki <mikko.vitamaki@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
esp-hal = { version = "0.20.1", features = ["esp32c6"] }
esp-hal-embassy = { version = "0.3.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.14.1", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.11.0", features = ["esp32c6", "log"] }
esp-wifi = { version = "0.9.1", features = ["esp32c6", "async", "embassy-net", "wifi"] }
esp-alloc = "0.4.0"

embassy-executor = { version = "0.6.0", features = ["task-arena-size-32768", "arch-riscv32", "executor-thread"] }
embassy-time = "0.3.0"
embassy-net = { version = "0.4.0", features = ["tcp", "udp", "dhcpv4", "medium-ethernet"] }

embedded-io-async = "0.6.1"
embedded-svc = { version = "0.28.0", default-features = false }
heapless = { version = "0.8.0", default-features = false }
static_cell = "2.1.0"
log = { version = "0.4.22" }
