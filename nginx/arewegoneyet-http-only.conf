# Temporary HTTP-only configuration for getting Let's Encrypt certificate
# Use this BEFORE obtaining certificates, then switch to arewegoneyet.conf

server {
    listen 80;
    listen [::]:80;
    server_name arewegoneyet.xn--viitamki-5za.fi;

    # Access and error logs
    access_log /var/log/nginx/arewegoneyet_access.log;
    error_log /var/log/nginx/arewegoneyet_error.log;

    # Let's Encrypt challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy all other traffic to backend
    location / {
        proxy_pass http://localhost:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
