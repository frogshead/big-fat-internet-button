# Nginx configuration for Big Red Button backend
# Place this file in /etc/nginx/sites-available/arewegoneyet.conf
# Then symlink to sites-enabled: ln -s /etc/nginx/sites-available/arewegoneyet.conf /etc/nginx/sites-enabled/

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name arewegoneyet.xn--viitmki-0za.fi;

    # Let's Encrypt challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arewegoneyet.xn--viitmki-0za.fi;

    # SSL certificate paths (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/arewegoneyet.xn--viitmki-0za.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arewegoneyet.xn--viitmki-0za.fi/privkey.pem;

    # SSL configuration (Mozilla Intermediate profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # HSTS (uncomment after testing)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # SSL session cache
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Access and error logs
    access_log /var/log/nginx/arewegoneyet_access.log;
    error_log /var/log/nginx/arewegoneyet_error.log;

    # Client upload size (adjust if needed)
    client_max_body_size 10M;

    # Proxy settings
    location / {
        # Proxy to Docker container
        proxy_pass http://localhost:3000;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Optional: serve static files directly if you add them later
    # location /static/ {
    #     alias /var/www/arewegoneyet/static/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }
}
