# HTTP Gateway for ESP32 Devices
# Accepts HTTP requests from IoT devices and forwards to local backend
# Place this file in /etc/nginx/sites-available/esp32-http-gateway.conf

server {
    listen 8080;
    listen [::]:8080;

    # No server_name needed - accepts any hostname
    # This allows ESP32 to connect via IP address

    # Access and error logs
    access_log /var/log/nginx/esp32_gateway_access.log;
    error_log /var/log/nginx/esp32_gateway_error.log;

    # Security: Limit request size (IoT devices send small payloads)
    client_max_body_size 1M;

    # Security: Rate limiting (optional but recommended)
    # Prevents abuse if port 8080 is exposed to internet
    limit_req_zone $binary_remote_addr zone=esp32_limit:10m rate=10r/s;
    limit_req zone=esp32_limit burst=20 nodelay;

    # Proxy all requests to backend
    location / {
        # Forward to local backend
        proxy_pass http://localhost:4000;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for IoT devices (may have slow connections)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "Gateway OK\n";
        add_header Content-Type text/plain;
    }
}
